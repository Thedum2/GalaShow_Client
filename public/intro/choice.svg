<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" width="560" height="140">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1230"/><stop offset="1" stop-color="#05070F"/></linearGradient>
  </defs>
  <rect width="560" height="140" fill="url(#bg)"/>
  <!-- incoming chat inputs -->
  <circle cx="120" cy="36" r="6" fill="#03C75A" opacity="0.85"/>
  <circle cx="106" cy="56" r="6" fill="#6EA0FF" opacity="0.85"/>
  <circle cx="122" cy="76" r="6" fill="#FFDE59" opacity="0.85"/>
  <circle cx="108" cy="96" r="6" fill="#FF5A5A" opacity="0.85"/>
  <!-- options -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="800" text-anchor="middle">
    <rect x="150" y="22" width="110" height="58" rx="12" fill="#0545B1" stroke="#FFDE59" stroke-width="3"/>
    <text x="205" y="62" font-size="30" fill="#FFFFFF">A</text>
    <rect x="300" y="22" width="110" height="58" rx="12" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"/>
    <text x="355" y="62" font-size="30" fill="#FFFFFF" opacity="0.85">B</text>
  </g>
  <!-- input received check -->
  <g transform="translate(256 26)">
    <circle r="12" fill="#03C75A"/>
    <path d="M-5 0 l4 4 l7 -8" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- choice distribution -->
  <rect x="150" y="96" width="260" height="12" rx="6" fill="#FFFFFF" opacity="0.15"/>
  <rect x="150" y="96" width="164" height="12" rx="6" fill="#FFDE59"/>
  <!-- timer -->
  <g transform="translate(448 62)">
    <circle r="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="5"/>
    <path d="M0 -22 A22 22 0 1 1 -19 11" fill="none" stroke="#FF0000" stroke-width="5" stroke-linecap="round"/>
    <path d="M0 0 V-11 M0 0 L7 5" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
